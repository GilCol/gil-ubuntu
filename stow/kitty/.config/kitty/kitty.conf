# Kitty configuration managed by gil-ubuntu.

# Keep terminal output quiet unless a command explicitly needs attention.
enable_audio_bell no

# Make copied selections immediately available to the clipboard.
copy_on_select yes

# Use a small amount of space between the terminal content and window edge.
window_padding_width 8

# Enable focus highly custom shader
custom_shaders focus-highlight


# BEGIN_KITTY_THEME
# Spacedust
include current-theme.conf
# END_KITTY_THEME
